<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contacto</title>
  <link rel="stylesheet" href="../styles/style.css">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
</head>
<body class="fade-in">
  <header class="header">
    <div class="container">
      <img src="../images/logo.png" alt="Logo de Pls Donate" class="logo">
      <nav class="navigation">
        <div class="button-container">
          <button class="nav-button" onclick="location.href='../pages/home.html'">Inicio</button>
          <button class="nav-button" onclick="location.href='../pages/catalog.html'">Catálogo</button>
        </div>
      </nav>
    </div>
  </header>

  <main class="grid-container">
    <section class="content-section">
      <h1>Contacto</h1>
      <form id="contact-form" class="donation-form">
        <div class="form-group">
          <label for="nombre">Nombre</label>
          <input type="text" id="nombre" name="nombre" required minlength="3" />
          <span class="error" id="err-nombre"></span>
        </div>
        <div class="form-group">
          <label for="correo">Correo</label>
          <input type="email" id="correo" name="correo" required />
          <span class="error" id="err-correo"></span>
        </div>
        <div class="form-group">
          <label for="mensaje">Mensaje</label>
          <textarea id="mensaje" name="mensaje" required minlength="10"></textarea>
          <span class="error" id="err-mensaje"></span>
        </div>
        <button type="submit" class="cta-button">Enviar</button>
      </form>
    </section>
  </main>

  <footer class="footer">
    <div class="container">
      <p>© 2025 Pls Donate. Todos los derechos reservados.</p>
      <p>Desarrollado por Grupo 5 Enterprise</p>
      <p>Contacto: +593 994993546 | Email: plsdonate@plsdonate.org</p>
      <p>Dirección: Calle street 122, Florida, Miami</p>
      <p>
        Redes Sociales:
        <a href="https://www.facebook.com/PlsDonate" target="_blank"><i class="fab fa-facebook"></i> Facebook</a> |
        <a href="https://www.twitter.com/PlsDonate" target="_blank"><i class="fab fa-twitter"></i> Twitter</a> |
        <a href="https://www.instagram.com/PlsDonate" target="_blank"><i class="fab fa-instagram"></i> Instagram</a>
      </p>
    </div>
  </footer>

  <script>
    const form = document.getElementById('contact-form');
    form.addEventListener('submit', e => {
      e.preventDefault();
      let valid = true;
      const name = form.nombre.value.trim();
      const email = form.correo.value.trim();
      const message = form.mensaje.value.trim();

      document.getElementById('err-nombre').textContent = '';
      document.getElementById('err-correo').textContent = '';
      document.getElementById('err-mensaje').textContent = '';

      if (name.length < 3) {
        document.getElementById('err-nombre').textContent = 'Nombre demasiado corto';
        valid = false;
      }
      if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) {
        document.getElementById('err-correo').textContent = 'Correo inválido';
        valid = false;
      }
      if (message.length < 10) {
        document.getElementById('err-mensaje').textContent = 'Mensaje muy corto';
        valid = false;
      }

      if (valid) {
        alert('Gracias por contactarnos');
        form.reset();
      }
    });
  </script>
</body>
</html>
